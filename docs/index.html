<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ballgame Support</title>
<style>
  :root{
    --bg: #6F8C69;
    --ink: #FFFFFF;
    --accent: #C79A63;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    text-align:center;
    padding: 24px;
  }

  .card{
    max-width: 480px;
  }

  .logo{
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    display: block;
  }

  h1{
    font-size: clamp(26px, 5vw, 34px);
    margin: 0 0 12px;
    color: #fff;
  }

  p{
    font-size: 16px;
    color: rgba(255,255,255,0.85);
    margin: 0 0 28px;
  }

  a.email{
    display:inline-block;
    font-size: clamp(17px, 4vw, 20px);
    color: #fff;
    text-decoration:none;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--accent);
    transition: color 0.2s ease;
  }

  a.email:hover{
    color: var(--accent);
  }

  footer{
    margin-top: 40px;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
  }
</style>
</head>
